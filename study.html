<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>暑假学习计划｜准大学生工具箱</title><link rel="stylesheet" href="assets/css/styles.css"></head>
<body><header class="site-header"><a class="brand" href="index.html"><span>🎒</span> 准大学生工具箱</a><button class="nav-toggle" type="button" aria-label="打开导航" aria-expanded="false">☰</button><nav class="nav-links"><a href="index.html">首页</a><a href="budget.html">生活费预算</a><a href="dorm.html">宿舍清单</a><a class="active" href="study.html">学习计划</a><a href="investment.html">投资复盘</a></nav></header>
<main class="container page-main"><div class="page-title"><span class="eyebrow">自我提升</span><h1>暑假学习计划生成器</h1><p>目标不用宏大，稳定前进就已经很酷。</p></div>
<div class="two-column study-layout"><form class="panel" id="plan-form"><h2>告诉我你的安排</h2><label>学习目标<textarea id="goal" rows="3" placeholder="例如：学完 Python 入门，并做一个小项目" required></textarea></label><div class="form-grid"><label>开始日期<input type="date" id="start-date" required></label><label>结束日期<input type="date" id="end-date" required></label><label>每周学习天数<select id="days-week"><option value="3">3 天</option><option value="4">4 天</option><option value="5" selected>5 天</option><option value="6">6 天</option><option value="7">7 天</option></select></label><label>每天投入时间<select id="hours-day"><option value="0.5">0.5 小时</option><option value="1">1 小时</option><option value="2" selected>2 小时</option><option value="3">3 小时</option><option value="4">4 小时</option></select></label></div><label>当前基础<select id="level"><option value="零基础">零基础</option><option value="了解一点">了解一点</option><option value="已有基础">已有基础</option></select></label><button class="button full" type="submit">生成我的计划</button></form>
<section class="panel plan-result" id="plan-result"><div class="empty-state"><span>🗓️</span><h2>你的计划会出现在这里</h2><p>填写左侧信息，得到一份分阶段计划。</p></div></section></div></main><script src="assets/js/common.js"></script><script src="assets/js/study.js"></script></body></html>
