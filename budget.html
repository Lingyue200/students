<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生活费预算计算器｜准大学生工具箱</title><link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html"><span>🎒</span> 准大学生工具箱</a><button class="nav-toggle" type="button" aria-label="打开导航" aria-expanded="false">☰</button><nav class="nav-links"><a href="index.html">首页</a><a class="active" href="budget.html">生活费预算</a><a href="dorm.html">宿舍清单</a><a href="study.html">学习计划</a><a href="investment.html">投资复盘</a></nav></header>
  <main class="container page-main">
    <div class="page-title"><span class="eyebrow">生活管理</span><h1>生活费预算计算器</h1><p>先给每一笔钱安排去处，花起来才更安心。</p></div>
    <div class="two-column">
      <form class="panel" id="budget-form">
        <h2>填写每月预算</h2>
        <label>每月生活费（元）<input type="number" id="income" min="0" step="100" value="2000" required></label>
        <div class="form-grid">
          <label>餐饮<input type="number" id="food" min="0" value="900"></label>
          <label>住宿/水电<input type="number" id="housing" min="0" value="200"></label>
          <label>交通<input type="number" id="transport" min="0" value="150"></label>
          <label>学习<input type="number" id="study-cost" min="0" value="100"></label>
          <label>娱乐社交<input type="number" id="fun" min="0" value="250"></label>
          <label>其他<input type="number" id="other" min="0" value="100"></label>
        </div>
        <button class="button full" type="submit">计算预算</button>
      </form>
      <section class="panel result-panel" aria-live="polite">
        <h2>预算结果</h2>
        <div class="money-result"><small>每月预计结余</small><strong id="balance">¥300</strong></div>
        <div class="stats"><div><span>每日可用</span><strong id="daily">¥66.67</strong></div><div><span>储蓄率</span><strong id="saving-rate">15%</strong></div></div>
        <div class="progress-wrap"><div class="progress-label"><span>已分配</span><span id="allocated-text">85%</span></div><div class="progress"><i id="allocated-bar"></i></div></div>
        <div id="budget-tip" class="tip">预算状态健康，可以留一点弹性应对临时开销。</div>
        <button class="button secondary full" id="save-budget" type="button">保存本次预算</button>
      </section>
    </div>
  </main>
  <script src="assets/js/common.js"></script><script src="assets/js/budget.js"></script>
</body></html>
