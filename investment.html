<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>投资复盘表｜准大学生工具箱</title><link rel="stylesheet" href="assets/css/styles.css"></head>
<body><header class="site-header"><a class="brand" href="index.html"><span>🎒</span> 准大学生工具箱</a><button class="nav-toggle" type="button" aria-label="打开导航" aria-expanded="false">☰</button><nav class="nav-links"><a href="index.html">首页</a><a href="budget.html">生活费预算</a><a href="dorm.html">宿舍清单</a><a href="study.html">学习计划</a><a class="active" href="investment.html">投资复盘</a></nav></header>
<main class="container page-main"><div class="page-title"><span class="eyebrow">财商启蒙</span><h1>投资复盘表</h1><p>只记录，不荐股。大学阶段更应该先建立风险意识。</p></div>
<div class="investment-layout"><form class="panel" id="review-form"><h2>新增复盘</h2><div class="form-grid"><label>标的名称<input id="asset-name" placeholder="例如：沪深300指数基金" required></label><label>复盘日期<input type="date" id="review-date" required></label><label>操作类型<select id="action"><option>买入</option><option>卖出</option><option>持有观察</option><option>模拟交易</option></select></label><label>金额（元）<input type="number" id="amount" min="0" placeholder="1000"></label></div><label>当时的决策依据<textarea id="reason" rows="3" placeholder="为什么做出这个决定？" required></textarea></label><label>结果与反思<textarea id="reflection" rows="3" placeholder="发生了什么？判断对在哪里、错在哪里？" required></textarea></label><label>下次改进<textarea id="improvement" rows="2" placeholder="写一条具体可执行的改进"></textarea></label><button class="button full" type="submit">保存复盘记录</button></form>
<section><div class="list-header"><h2>历史记录</h2><button id="export-reviews" class="text-button" type="button">导出 JSON</button></div><div id="review-list" class="review-list"></div></section></div></main><script src="assets/js/common.js"></script><script src="assets/js/investment.js"></script></body></html>
